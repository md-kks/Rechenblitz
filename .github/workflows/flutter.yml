name: Flutter CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in             ANDROID_UPLOAD_KEYSTORE_BASE64             ANDROID_KEYSTORE_PASSWORD             ANDROID_KEY_ALIAS             ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/rechenblitz-upload.p12"
          KEY_PROPERTIES_PATH="$RUNNER_TEMP/rechenblitz-key.properties"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$KEY_PROPERTIES_PATH"
          chmod 600 "$KEY_PROPERTIES_PATH"
          echo "RECHENBLITZ_KEY_PROPERTIES=$KEY_PROPERTIES_PATH" >> "$GITHUB_ENV"
          echo "RECHENBLITZ_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner |
            sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs             build/app/outputs/flutter-apk/app-release.apk
      - name: Verify release privacy permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 |
            sort -V | tail -n 1)"
          test -x "$AAPT2"
          PERMISSIONS="$("$AAPT2" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          grep -Fq "android.permission.CAMERA" <<< "$PERMISSIONS"
          forbidden=(
            android.permission.INTERNET
            android.permission.ACCESS_NETWORK_STATE
            android.permission.RECORD_AUDIO
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.WRITE_EXTERNAL_STORAGE
            android.permission.MANAGE_EXTERNAL_STORAGE
            android.permission.READ_MEDIA_IMAGES
            android.permission.READ_MEDIA_VIDEO
            android.permission.READ_MEDIA_AUDIO
            android.permission.ACCESS_FINE_LOCATION
            android.permission.ACCESS_COARSE_LOCATION
            android.permission.READ_CONTACTS
            android.permission.WRITE_CONTACTS
            android.permission.READ_PHONE_STATE
            android.permission.READ_PHONE_NUMBERS
            android.permission.POST_NOTIFICATIONS
            com.google.android.gms.permission.AD_ID
          )
          for permission in "${forbidden[@]}"; do
            if grep -Fq "$permission" <<< "$PERMISSIONS"; then
              echo "::error::Unexpected release permission: $permission"
              exit 1
            fi
          done
      - name: Verify local-only Android backup policy
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer |
            sort -V | tail -n 1)"
          test -x "$APKANALYZER"
          MANIFEST="$("$APKANALYZER" manifest print "$APK")"
          printf '%s\n' "$MANIFEST" | grep -A12 "<application" | head -20
          grep -Fq 'android:allowBackup="false"' <<< "$MANIFEST"
          grep -Fq 'android:fullBackupContent="false"' <<< "$MANIFEST"
          grep -Fq 'android:dataExtractionRules=' <<< "$MANIFEST"
      - name: Verify optional camera hardware
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 |
            sort -V | tail -n 1)"
          test -x "$AAPT2"
          BADGING="$("$AAPT2" dump badging "$APK")"
          printf '%s\n' "$BADGING" |
            grep -E "uses-feature.*android.hardware.camera" || true
          camera_features=(
            android.hardware.camera.any
            android.hardware.camera
            android.hardware.camera.autofocus
            android.hardware.camera.flash
          )
          for feature in "${camera_features[@]}"; do
            if ! grep -Fq               "uses-feature-not-required: name='$feature'" <<< "$BADGING"; then
              echo "::error::Camera hardware must stay optional: $feature"
              exit 1
            fi
          done
      - name: Verify Android 16 KB page size compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign |
            sort -V | tail -n 1)"
          ndk_roots=()
          for root in \
            "${ANDROID_NDK_HOME:-}" \
            "${ANDROID_NDK_ROOT:-}" \
            "${ANDROID_SDK_ROOT:-}/ndk" \
            "${ANDROID_HOME:-}/ndk" \
            "$HOME/android-sdk/ndk"; do
            if [ -n "$root" ] && [ -d "$root" ]; then
              ndk_roots+=("$root")
            fi
          done
          if [ "${#ndk_roots[@]}" -eq 0 ]; then
            echo "::error::No Android NDK directory found"
            exit 1
          fi

          OBJDUMP="$(
            find "${ndk_roots[@]}" \
              -type f \
              -path "*/toolchains/llvm/prebuilt/*/bin/llvm-objdump" |
              sort -V | tail -n 1
          )"
          test -x "$ZIPALIGN"
          test -x "$OBJDUMP"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK" > /dev/null

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q "$APK" "lib/arm64-v8a/*.so" "lib/x86_64/*.so"             -d "$TMP_DIR"

          native_count=0
          failed=0
          while IFS= read -r -d '' so; do
            native_count=$((native_count + 1))
            bad_loads="$("$OBJDUMP" -p "$so" | awk '
              /^    LOAD/ {
                alignment = $NF
                sub(/^2\*\*/, "", alignment)
                if ((alignment + 0) < 14) print
              }
            ')"
            if [ -n "$bad_loads" ]; then
              echo "::error::16 KB ELF alignment failed: $so"
              printf '%s\n' "$bad_loads"
              failed=1
            fi
          done < <(
            find "$TMP_DIR/lib/arm64-v8a" "$TMP_DIR/lib/x86_64"               -type f -name "*.so" -print0
          )

          if [ "$native_count" -eq 0 ]; then
            echo "::error::No 64-bit native libraries found in release APK"
            exit 1
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        with:
          name: Rechenblitz-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - run: flutter build appbundle --release
      - name: Verify release AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" > /dev/null
          jarsigner -verify "$AAB" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Rechenblitz-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Rechenblitz-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RECHENBLITZ_KEY_PROPERTIES:-}"
          rm -f "${RECHENBLITZ_KEYSTORE_PATH:-}"

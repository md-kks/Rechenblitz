name: Roman touch patch

on:
  push:
    branches:
      - feat/touch-roman-numerals

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/touch-roman-numerals
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
      - name: Apply Roman numeral touch slice
        run: python3 .github/scripts/roman_touch_patch.py
      - name: Validate diff
        run: git diff --check
      - name: Validate Roman numeral touch slice
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/roman_touch_interaction_test.dart
      - name: Commit validated slice
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml android/gradlew 2>/dev/null || true
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          rm -f .github/workflows/roman-touch-patch.yml
          rm -f .github/scripts/roman_touch_patch.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add roman numeral touch'
          git push origin HEAD:feat/touch-roman-numerals
